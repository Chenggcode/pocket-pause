<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'"><link rel="stylesheet" href="styles.css"><title>提醒</title></head>
<body>
  <main id="pet" class="pet idle" data-pet-style="mint-cat" data-icon-style="soft">
    <section id="bubble" class="bubble" aria-live="polite"></section>
    <button id="hide" class="hide-button" title="隐藏宠物" aria-label="隐藏宠物">×</button>
    <div class="character" role="img" aria-label="薄荷猫">
      <div class="ear left"></div><div class="ear right"></div>
      <div class="head"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i><span class="cheek left"></span><span class="cheek right"></span></div>
      <div class="body"><span class="belly"></span></div>
      <div class="shadow"></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
